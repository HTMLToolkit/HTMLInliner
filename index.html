<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTMLInliner - Visual Dependency Inliner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <aside id="sidebar">
            <header>
                <p class="eyebrow">Project utility</p>
                <h1>HTMLInliner</h1>
                <p>Drop a static web project, visualize every dependency, and download a single-file build with all assets inlined.</p>
            </header>

            <div class="control-group">
                <label for="files">Project bundle</label>
                <input type="file" id="files" multiple>
                <p class="hint">Select every file in your project folder (drag-select works in most browsers).</p>
            </div>

            <button id="downloadBtn" disabled>Download Inlined HTML</button>
            <p class="helper-text">The graph updates as soon as your project finishes parsing.</p>

            <section class="log-wrapper">
                <div class="log-header">
                    <span>Activity Log</span>
                </div>
                <div id="log" aria-live="polite"></div>
            </section>
        </aside>

        <section id="svgContainer" aria-label="Dependency graph">
            <svg id="svg" role="img" aria-label="Dependency graph canvas"></svg>
        </section>
    </main>

    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
